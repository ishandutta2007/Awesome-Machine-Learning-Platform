<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 52px;
        font-weight: 800;
        fill: url(#titleGradient);
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 400;
        fill: #9CA3AF;
        letter-spacing: 0.5px;
      }
      .tag {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #38BDF8;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Dynamic Animations */
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-25px) scale(1.2); opacity: 0.9; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }

      .flow-line {
        stroke-dasharray: 8 8;
        animation: dashFlow 20s linear infinite;
      }

      .orbital-ring {
        transform-origin: 950px 200px;
        animation: orbit 40s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Grid Tech Lines in Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Background Dynamic Network Graphic (Right Side Background) -->
  <g opacity="0.35">
    <circle cx="950" cy="200" r="160" fill="none" stroke="url(#accentGradient)" stroke-width="2" />
    <circle cx="950" cy="200" r="120" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 6" class="orbital-ring" />
    <circle cx="950" cy="200" r="70" fill="none" stroke="#A78BFA" stroke-width="2" />

    <!-- Network Nodes & Connecting Flow Lines -->
    <path d="M 800 120 L 950 200 L 1100 140 M 950 200 L 1050 290 M 850 280 L 950 200" fill="none" stroke="#38BDF8" stroke-width="2" class="flow-line" />
    
    <!-- Nodes -->
    <circle cx="800" cy="120" r="8" fill="#3B82F6" class="particle-1" filter="url(#glow)" />
    <circle cx="1100" cy="140" r="10" fill="#8B5CF6" class="particle-2" filter="url(#glow)" />
    <circle cx="1050" cy="290" r="7" fill="#F472B6" class="particle-3" filter="url(#glow)" />
    <circle cx="850" cy="280" r="9" fill="#10B981" class="particle-1" filter="url(#glow)" />
    <circle cx="950" cy="200" r="14" fill="#60A5FA" filter="url(#glow)" />
  </g>

  <!-- Floating Particles in Background -->
  <circle cx="150" cy="70" r="4" fill="#60A5FA" class="particle-1" opacity="0.5" />
  <circle cx="550" cy="330" r="5" fill="#A78BFA" class="particle-2" opacity="0.6" />
  <circle cx="700" cy="60" r="3" fill="#F472B6" class="particle-3" opacity="0.5" />

  <!-- FOREGROUND TEXT & CONTENT (Guaranteed Unobscured) -->
  <g filter="url(#softShadow)" transform="translate(80, 0)">

    <!-- Top Badge Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="280" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="18" cy="17" r="6" fill="#10B981" />
      <text x="34" y="22" class="tag">CURATED MLOPS &amp; AI INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="170" class="title">Awesome Machine Learning Platform</text>

    <!-- Subtitle -->
    <text x="0" y="215" class="subtitle">Top SaaS Platforms &amp; Open-Source AI Infrastructure Ecosystem</text>

    <!-- Tech Stack Feature Pills -->
    <g transform="translate(0, 255)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="36" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
        <text x="65" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#93C5FD" text-anchor="middle">🤖 MLOps</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="160" height="36" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" />
        <text x="80" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#C4B5FD" text-anchor="middle">🚀 Model Serving</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(320, 0)">
        <rect width="150" height="36" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
        <text x="75" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#6EE7B7" text-anchor="middle">📦 Feature Store</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(485, 0)">
        <rect width="140" height="36" rx="8" fill="#1E293B" stroke="#F472B6" stroke-width="1.5" />
        <text x="70" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FBCFE8" text-anchor="middle">📊 AutoML</text>
      </g>
    </g>

  </g>
</svg>
