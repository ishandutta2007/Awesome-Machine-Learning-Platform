<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0B0F19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070A10"/></linearGradient><linearGradient id="titleGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60A5FA"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#F472B6"/></linearGradient><linearGradient id="accentGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3B82F6" stop-opacity=".8"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="12"/></filter><style>@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-25px) scale(1.2);opacity:.9}}.subtitle,.tag,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-size:52px;font-weight:800;fill:url(#titleGradient);letter-spacing:-.5px}.subtitle{font-size:22px;font-weight:400;fill:#9ca3af;letter-spacing:.5px}.tag{font-size:13px;font-weight:600;fill:#38bdf8;letter-spacing:1px;text-transform:uppercase}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out infinite 2s}.particle-3{animation:floatParticle 7s ease-in-out infinite 4s}.flow-line{stroke-dasharray:8 8;animation:dashFlow 20s linear infinite}.orbital-ring{transform-origin:950px 200px;animation:orbit 40s linear infinite}</style></defs><rect width="1200" height="400" fill="url(#bgGradient)" rx="16"/><g stroke="#FFF" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="200" x2="200" y1="0" y2="400"/><line x1="400" x2="400" y1="0" y2="400"/><line x1="600" x2="600" y1="0" y2="400"/><line x1="800" x2="800" y1="0" y2="400"/><line x1="1000" x2="1000" y1="0" y2="400"/></g><g opacity=".35"><circle cx="950" cy="200" r="160" fill="none" stroke="url(#accentGradient)" stroke-width="2"/><circle cx="950" cy="200" r="120" fill="none" stroke="#60A5FA" stroke-dasharray="6 6" stroke-width="1.5" class="orbital-ring"/><circle cx="950" cy="200" r="70" fill="none" stroke="#A78BFA" stroke-width="2"/><path fill="none" stroke="#38BDF8" stroke-width="2" d="M 800 120 L 950 200 L 1100 140 M 950 200 L 1050 290 M 850 280 L 950 200" class="flow-line"/><circle cx="800" cy="120" r="8" fill="#3B82F6" class="particle-1" filter="url(#glow)"/><circle cx="1100" cy="140" r="10" fill="#8B5CF6" class="particle-2" filter="url(#glow)"/><circle cx="1050" cy="290" r="7" fill="#F472B6" class="particle-3" filter="url(#glow)"/><circle cx="850" cy="280" r="9" fill="#10B981" class="particle-1" filter="url(#glow)"/><circle cx="950" cy="200" r="14" fill="#60A5FA" filter="url(#glow)"/></g><circle cx="150" cy="70" r="4" fill="#60A5FA" class="particle-1" opacity=".5"/><circle cx="550" cy="330" r="5" fill="#A78BFA" class="particle-2" opacity=".6"/><circle cx="700" cy="60" r="3" fill="#F472B6" class="particle-3" opacity=".5"/><g filter="url(#softShadow)" transform="translate(80, 0)"><g transform="translate(0, 75)"><rect width="280" height="34" x="0" y="0" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="17"/><circle cx="18" cy="17" r="6" fill="#10B981"/><text x="34" y="22" class="tag">CURATED MLOPS &amp; AI INFRASTRUCTURE</text></g><text x="0" y="170" class="title">Awesome Machine Learning Platform</text><text x="0" y="215" class="subtitle">Top SaaS Platforms &amp; Open-Source AI Infrastructure Ecosystem</text><g><g transform="translate(0, 255) translate(0, 0)"><rect width="130" height="36" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" rx="8"/><text x="65" y="23" fill="#93C5FD" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">🤖 MLOps</text></g><g transform="translate(0, 255) translate(145, 0)"><rect width="160" height="36" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" rx="8"/><text x="80" y="23" fill="#C4B5FD" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">🚀 Model Serving</text></g><g transform="translate(0, 255) translate(320, 0)"><rect width="150" height="36" fill="#1E293B" stroke="#10B981" stroke-width="1.5" rx="8"/><text x="75" y="23" fill="#6EE7B7" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">📦 Feature Store</text></g><g transform="translate(0, 255) translate(485, 0)"><rect width="140" height="36" fill="#1E293B" stroke="#F472B6" stroke-width="1.5" rx="8"/><text x="70" y="23" fill="#FBCFE8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">📊 AutoML</text></g></g></g></svg>